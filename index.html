<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Battery Killer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;color:#9dff6b;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl,#fx,#bright{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{opacity:.75;mix-blend-mode:screen;pointer-events:none}
  #bright{opacity:.35;mix-blend-mode:screen;pointer-events:none}
  #vid{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
  .hud{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;gap:12px;
    flex-wrap:wrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:linear-gradient(#000e,#0000);pointer-events:none;z-index:5}
  .k{opacity:.4}.v{color:#e8ffe0;font-weight:700}
  #stat{position:fixed;left:12px;bottom:12px;font-size:10px;letter-spacing:.1em;
    line-height:1.85;text-transform:uppercase;z-index:5;pointer-events:none;opacity:.8}
  #stat b{color:#e8ffe0;font-weight:700}#stat .off{color:#ff5d5d}
  #stop{position:fixed;right:12px;bottom:12px;z-index:20;background:#111;color:#9dff6b;
    border:1px solid #9dff6b44;padding:8px 14px;font:inherit;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
  #banner{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:8;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fff;
    border:1px solid #9dff6b66;background:#000b;padding:10px 18px;
    pointer-events:none;transition:opacity .4s;animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.35}}
  #err{position:fixed;left:12px;right:12px;top:50%;transform:translateY(-50%);z-index:30;
    font-size:11px;line-height:1.5;color:#ff8a8a;background:#1a0000ee;
    border:1px solid #ff5d5d;padding:12px;display:none;white-space:pre-wrap;
    max-height:60%;overflow:auto}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="bright"></canvas>
<video id="vid" muted playsinline></video>

<div class="hud">
  <span><span class="k">bat</span> <span class="v" id="lvl">--%</span></span>
  <span><span class="k">drain</span> <span class="v" id="rate">--</span></span>
  <span><span class="k">left</span> <span class="v" id="left">--</span></span>
  <span><span class="k">ops/s</span> <span class="v" id="ops">0</span></span>
  <span><span class="k">fps</span> <span class="v" id="fps">0</span></span>
  <span><span class="k">load</span> <span class="v" id="load">3x</span></span>
  <span><span class="k">t</span> <span class="v" id="el">0s</span></span>
</div>

<div id="banner">tap anywhere &mdash; audio + vibration</div>
<div id="stat"></div>
<div id="err"></div>
<button id="stop">stop</button>

<script>
/* global error surface: anything that breaks is printed, never silent */
window.onerror = function (m, s, l) {
  var e = document.getElementById("err");
  e.style.display = "block";
  e.textContent += "ERR line " + l + ": " + m + "\n";
  return false;
};

(function () {
"use strict";

var S = { gpu:0, cpu:0, workers:0, audio:0, dsp:0, vib:0, gps:0, wake:0, bat:0, vid:0 };
var running = true, actx = null, wakeLock = null, vidStream = null;
var workers = [], timers = [], rafIds = [], geoId = null, audioTries = 0;
var opsMain = 0, opsWk = 0, opsSeen = 0, opsT = performance.now();
var frames = 0, t0 = performance.now(), startT = performance.now();
var passes = 3, scale = 1.5;

function $(id) { return document.getElementById(id); }
function safe(fn) { try { return fn() !== false; } catch (e) { return false; } }

/* ============ GESTURE LISTENERS FIRST — before any init ============ */
function arm() {
  armAudio();
  buzz();
}
["pointerdown", "touchstart", "click", "keydown", "touchend"].forEach(function (ev) {
  document.addEventListener(ev, arm, { passive: true, capture: true });
});

function paintStat() {
  var r = [["GPU", S.gpu], ["CPU", S.cpu], ["THREADS", S.workers], ["AUDIO", S.audio],
           ["DSP", S.dsp], ["VIBRATE", S.vib], ["GPS", S.gps], ["SCREEN", S.wake],
           ["VIDEO", S.vid], ["BATTERY API", S.bat]];
  var h = "";
  for (var i = 0; i < r.length; i++) {
    var on = r[i][1];
    h += '<span class="' + (on ? "" : "off") + '">' + r[i][0] + " <b>" +
         (on === true || on === 1 ? "OK" : (on === 0 ? "OFF" : on)) + "</b></span><br>";
  }
  var s = $("stat");
  if (s) s.innerHTML = h;
  if (S.audio) {
    var b = $("banner");
    if (b) { b.style.opacity = "0"; setTimeout(function () { b.style.display = "none"; }, 400); }
  }
}

/* ================= GPU raymarcher ================= */
var glc = $("gl"), gl = null, prog = null, uni = {};

var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS = [
"precision highp float;uniform vec2 res;uniform float t;",
"float map(vec3 p){",
" float d=length(p)-1.0;",
" d=min(d,length(p-vec3(sin(t)*1.4,cos(t*1.1),0.0))-0.55);",
" d+=0.16*sin(p.x*6.0+t)*sin(p.y*6.0-t)*sin(p.z*6.0);",
" return d;}",
"void main(){",
" vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;",
" vec3 ro=vec3(0.,0.,-3.2),rd=normalize(vec3(uv,1.25));",
" float d=0.0,g=0.0;",
" for(int i=0;i<96;i++){",
"  vec3 p=ro+rd*d;float h=map(p);",
"  g+=0.022/(0.06+h*h*40.0);",
"  d+=max(h*0.65,0.012);",
"  if(d>9.5)break;",
" }",
" vec3 col=vec3(g*0.55,g*0.95,g*1.5);",
" for(int k=0;k<10;k++){col+=0.016*sin(vec3(t*0.7+float(k)*2.1+uv.xyx*26.0));}",
" col=pow(col,vec3(0.85));",
" gl_FragColor=vec4(col,1.0);}"
].join("\n");

function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }

function initGL() {
  gl = glc.getContext("webgl", { antialias:false, alpha:false, depth:false, stencil:false,
    powerPreference:"high-performance", desynchronized:true });
  if (!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  var b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  var l = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
  uni.res = gl.getUniformLocation(prog, "res");
  uni.t = gl.getUniformLocation(prog, "t");
  resizeGL();
  return true;
}

function resizeGL() {
  if (!gl) return;
  var d = Math.min(window.devicePixelRatio || 1, 3) * scale;
  var w = Math.min(Math.floor(innerWidth * d), 4096);
  var h = Math.min(Math.floor(innerHeight * d), 4096);
  glc.width = w; glc.height = h;
  gl.viewport(0, 0, w, h);
  if (uni.res) gl.uniform2f(uni.res, w, h);
}

function gpuLoop(t) {
  if (!running || !gl) return;
  for (var p = 0; p < passes; p++) {
    gl.uniform1f(uni.t, t * 0.0012 + p * 0.31);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  frames++;
  rafIds.push(requestAnimationFrame(gpuLoop));
}

/* ================= overlays ================= */
var fxc = $("fx"), ctx = fxc.getContext("2d");
function fxLoop() {
  if (!running) return;
  if (fxc.width !== innerWidth) fxc.width = innerWidth;
  if (fxc.height !== innerHeight) fxc.height = innerHeight;
  ctx.clearRect(0, 0, fxc.width, fxc.height);
  for (var i = 0; i < 700; i++) {
    var x = Math.random() * fxc.width, y = Math.random() * fxc.height;
    ctx.strokeStyle = "hsl(" + ((i * 11 + performance.now() * 0.08) % 360) + ",100%,62%)";
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - .5) * 240, y + (Math.random() - .5) * 240);
    ctx.stroke();
  }
  rafIds.push(requestAnimationFrame(fxLoop));
}

var bc = $("bright"), bctx = bc.getContext("2d");
function brightLoop() {
  if (!running) return;
  if (bc.width !== innerWidth) bc.width = innerWidth;
  if (bc.height !== innerHeight) bc.height = innerHeight;
  bctx.clearRect(0, 0, bc.width, bc.height);
  bctx.globalCompositeOperation = "lighter";
  var tt = performance.now() * 0.0004;
  for (var i = 0; i < 7; i++) {
    var cx = bc.width * (0.5 + 0.42 * Math.sin(tt + i * 1.7));
    var cy = bc.height * (0.5 + 0.42 * Math.cos(tt * 1.3 + i * 2.3));
    var rad = Math.max(bc.width, bc.height) * 0.22;
    var g = bctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, "rgba(255,255,255,.5)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    bctx.fillStyle = g;
    bctx.beginPath(); bctx.arc(cx, cy, rad, 0, 6.2832); bctx.fill();
  }
  rafIds.push(requestAnimationFrame(brightLoop));
}

/* ================= main thread burner ================= */
function burn() {
  if (!running) return;
  var x = 1.0001, y = .5;
  for (var i = 0; i < 200000; i++) {
    x = Math.sin(x * 1.0000001) + Math.sqrt(Math.abs(y)) * .0001;
    y = Math.cos(y) * 1.0000001 + Math.abs(x) * .0001;
  }
  opsMain += 200000;
  timers.push(setTimeout(burn, 0));
}

/* ================= workers ================= */
var WSRC = [
"var o=0,N=350000;",
"function s(){var x=1.0001,y=.3,a=new Float64Array(8192);",
"for(var i=0;i<N;i++){x=x*1.0000001+Math.sin(x)*.001;y=Math.sqrt(Math.abs(y))+Math.cos(x)*.001;a[i&8191]=x+y;}",
"o+=N;setTimeout(s,0);}",
"s();setInterval(function(){postMessage(o);},500);"
].join("\n");

function spawn() {
  var cores = navigator.hardwareConcurrency || 2;
  var n = Math.max(4, Math.min(cores * 2, 16));
  var url = URL.createObjectURL(new Blob([WSRC], { type: "text/javascript" }));
  for (var i = 0; i < n; i++) {
    try {
      var w = new Worker(url);
      w.onmessage = function (e) { opsWk += e.data; };
      workers.push(w);
    } catch (e) {}
  }
  S.workers = workers.length;
}

/* ================= audio ================= */
var WACODE = [
"class Burn extends AudioWorkletProcessor{",
"process(i,o){var a=o[0]&&o[0][0];if(!a)return true;",
"for(var n=0;n<a.length;n++){var x=0;",
"for(var k=1;k<32;k++){x+=Math.sin((currentTime+n/48000)*k*143.0);}",
"a[n]=x*0.005;}return true;}}",
"registerProcessor('burn',Burn);"
].join("\n");

function armAudio() {
  if (actx && actx.state === "running") return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!actx) {
    try { actx = new AC(); } catch (e) { return; }
    try {
      var m = actx.createGain(); m.gain.value = 0.45; m.connect(actx.destination);
      [38, 51, 76, 101, 152, 203].forEach(function (f, i) {
        var o = actx.createOscillator();
        o.type = i % 2 ? "sawtooth" : "square";
        o.frequency.value = f;
        var g = actx.createGain(); g.gain.value = 0.16 / (i + 1);
        o.connect(g); g.connect(m); o.start();
      });
      var len = actx.sampleRate * 3, nb = actx.createBuffer(1, len, actx.sampleRate);
      var d = nb.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var ns = actx.createBufferSource(); ns.buffer = nb; ns.loop = true;
      var ng = actx.createGain(); ng.gain.value = 0.22;
      ns.connect(ng); ng.connect(m); ns.start();
      startDSP();
    } catch (e) {}
  }
  try { actx.resume(); } catch (e) {}
  actx.onstatechange = function () {
    if (actx.state === "running" && !S.audio) { S.audio = 1; paintStat(); }
  };
  if (actx.state === "running" && !S.audio) { S.audio = 1; paintStat(); }
}

/* keep retrying until the context actually runs (autoplay policy) */
function audioWatchdog() {
  if (!running) return;
  if (S.audio) return;
  audioTries++;
  if (audioTries < 60) { armAudio(); timers.push(setTimeout(audioWatchdog, 400)); }
}
function startDSP() {
  if (!actx) return;
  var url = URL.createObjectURL(new Blob([WACODE], { type: "text/javascript" }));
  if (actx.audioWorklet) {
    actx.audioWorklet.addModule(url).then(function () {
      var n = new AudioWorkletNode(actx, "burn");
      var g = actx.createGain(); g.gain.value = 0.5;
      n.connect(g); g.connect(actx.destination);
      S.dsp = 1; paintStat();
    }).catch(fallbackDSP);
  } else fallbackDSP();
}
function fallbackDSP() {
  try {
    var n = actx.createScriptProcessor(1024, 1, 1);
    n.onaudioprocess = function (e) {
      var a = e.outputBuffer.getChannelData(0), tt = actx.currentTime;
      for (var i = 0; i < a.length; i++) {
        var x = 0;
        for (var k = 1; k < 24; k++) x += Math.sin((tt + i / 48000) * k * 137);
        a[i] = x * 0.006;
      }
    };
    var g = actx.createGain(); g.gain.value = 0.5;
    n.connect(g); g.connect(actx.destination);
    S.dsp = 1; paintStat();
  } catch (e) {}
}

/* ================= vibration ================= */
function buzz() {
  if (!running || !navigator.vibrate) return;
  try { navigator.vibrate(30000); S.vib = 1; paintStat(); } catch (e) {}
  if (!S.vibLoop) {
    S.vibLoop = 1;
    (function again() {
      if (!running) return;
      timers.push(setTimeout(function () { safe(buzz); again(); }, 25000));
    })();
  }
}

/* ================= wake lock / gps / flash / crypto / capture ================= */
function lock() {
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function (l) {
    wakeLock = l; S.wake = 1; paintStat();
    l.addEventListener("release", function () { S.wake = 0; paintStat(); if (running) lock(); });
  }).catch(function () {});
}

function gps() {
  if (!navigator.geolocation) return;
  geoId = navigator.geolocation.watchPosition(
    function () { if (!S.gps) { S.gps = 1; paintStat(); } },
    function () {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 });
}

function flashChurn() {
  if (!running || !window.indexedDB) return;
  var req = indexedDB.open("drain", 1);
  req.onupgradeneeded = function (e) { e.target.result.createObjectStore("k"); };
  req.onsuccess = function (e) {
    var db = e.target.result, blob = new Uint8Array(262144), n = 0;
    var iv = setInterval(function () {
      if (!running) { clearInterval(iv); return; }
      try { db.transaction("k", "readwrite").objectStore("k").put(blob, "b" + (n++ % 4)); } catch (err) {}
    }, 400);
    timers.push(iv);
  };
  req.onerror = function () {};
}

function hashChain() {
  if (!running || !window.crypto || !crypto.subtle) return;
  var buf = new Uint8Array(65536);
  crypto.subtle.digest("SHA-256", buf).then(hashChain).catch(function () {});
}

function startCapture() {
  if (!glc.captureStream) return;
  try {
    vidStream = glc.captureStream(60);
    var v = $("vid");
    v.srcObject = vidStream;
    var p = v.play();
    if (p && p.then) p.then(function () { S.vid = 1; paintStat(); }).catch(function () {});
    else { S.vid = 1; paintStat(); }
  } catch (e) {}
}

/* ================= battery ================= */
var samples = [];
function battery() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then(function (b) {
    S.bat = 1; paintStat();
    function draw() {
      var pct = Math.round(b.level * 100);
      $("lvl").textContent = pct + "%" + (b.charging ? " +" : "");
      var now = performance.now();
      if (!b.charging) samples.push([now, b.level]);
      var cut = now - 60000;
      while (samples.length && samples[0][0] < cut) samples.shift();
      if (samples.length > 1) {
        var mins = (now - samples[0][0]) / 60000;
        if (mins > 0.4) {
          var r = ((samples[0][1] - b.level) * 100) / mins;
          $("rate").textContent = Math.max(r, 0).toFixed(2) + " %/min";
          if (r > 0.001) {
            var left = (b.level * 100) / r;
            $("left").textContent = left > 600 ? "10h+" : Math.round(left) + " min";
          }
        }
      }
    }
    draw();
    b.addEventListener("levelchange", draw);
    b.addEventListener("chargingchange", draw);
    timers.push(setInterval(draw, 12000));
  }).catch(function () {});
}

/* ================= stats ================= */
function stats() {
  if (!running) return;
  var now = performance.now();
  var fps = Math.round((frames * 1000) / Math.max(now - t0, 1));
  frames = 0; t0 = now;
  if (fps > 52 && passes < 6) { passes++; $("load").textContent = passes + "x"; }
  else if (fps < 24 && passes > 1) { passes--; $("load").textContent = passes + "x"; }
  if (fps < 18 && scale > 0.9) { scale = 0.9; safe(resizeGL); }
  if (now - opsT > 900) {
    var all = opsMain + opsWk;
    $("ops").textContent = Math.round((all - opsSeen) / ((now - opsT) / 1000)).toLocaleString();
    opsSeen = all; opsT = now;
    $("fps").textContent = fps;
    $("el").textContent = Math.round((now - startT) / 1000) + "s";
    document.title = $("lvl").textContent + " · " + fps + "fps";
  }
  rafIds.push(requestAnimationFrame(stats));
}

/* ================= boot ================= */
S.gpu = safe(initGL) ? 1 : 0;
S.cpu = safe(burn) ? 1 : 0;
safe(spawn);
safe(battery);
safe(lock);
safe(gps);
safe(flashChurn);
safe(hashChain);
paintStat();

if (S.gpu) { rafIds.push(requestAnimationFrame(gpuLoop)); safe(startCapture); }
rafIds.push(requestAnimationFrame(fxLoop));
rafIds.push(requestAnimationFrame(brightLoop));
rafIds.push(requestAnimationFrame(stats));

/* try audio + vibration immediately, then keep retrying */
safe(armAudio);
safe(buzz);
timers.push(setTimeout(audioWatchdog, 400));

/* banner hides itself after 9s even if audio never arms */
timers.push(setTimeout(function () {
  if (!S.audio) { var b = $("banner"); if (b) b.style.display = "none"; }
}, 9000));

window.addEventListener("resize", function () { safe(resizeGL); });
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && running) { safe(lock); safe(armAudio); }
});

$("stop").addEventListener("click", function () {
  running = false;
  rafIds.forEach(function (i) { cancelAnimationFrame(i); });
  workers.forEach(function (w) { w.terminate(); });
  timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
  if (wakeLock) wakeLock.release().catch(function () {});
  if (geoId !== null && navigator.geolocation) navigator.geolocation.clearWatch(geoId);
  if (navigator.vibrate) navigator.vibrate(0);
  if (actx) actx.suspend();
  $("stop").textContent = "stopped";
  S.workers = 0; S.wake = 0; S.vib = 0; paintStat();
});
})();
</script>
</body>
</html>
