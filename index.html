
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Air Draw AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05090e;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#camera {
    position: relative;
    width: 100%;
    height: 100dvh;
    background: #080d14;
    overflow: hidden;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scaleX(-1);
}

#drawCanvas, #cursorCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
}

#cursorCanvas {
    z-index: 2;
}

.top {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.top h2 {
    margin: 0;
    font-size: 24px;
    text-shadow: 0 2px 10px black;
}

#status {
    display: inline-block;
    margin-top: 10px;
    background: #101c2bcc;
    border: 1px solid #34445b;
    border-radius: 30px;
    padding: 10px 16px;
    font-size: 13px;
}

#controls {
    position: absolute;
    bottom: 20px;
    left: 10px;
    right: 10px;
    z-index: 5;
    padding: 15px;
    background: #0b1422eF;
    border: 1px solid #28374c;
    border-radius: 20px;
}

.colors {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
}

.color {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid transparent;
    padding: 0;
}

.color.active {
    border-color: white;
    transform: scale(1.15);
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    background: #1e3046;
    border: 0;
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    font-weight: bold;
}

#clear {
    background: #c03949;
}

#start {
    background: #087eeb;
}

#brush {
    width: 100%;
    margin-top: 12px;
    accent-color: #00e6a0;
}

#instructions {
    position: absolute;
    top: 125px;
    left: 15px;
    z-index: 4;
    background: #101c2bcc;
    border-radius: 12px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.7;
    pointer-events: none;
}

</style>
</head>

<body>

<div id="camera">

    <video id="video" autoplay playsinline muted></video>

    <canvas id="drawCanvas"></canvas>
    <canvas id="cursorCanvas"></canvas>

    <div class="top">
        <h2>Air Draw AR</h2>
        <div id="status">Press Start Camera</div>
    </div>

    <div id="instructions">
        ☝️ + 👍 Touch fingers = Draw<br>
        Separate fingers = Stop drawing<br>
        Move your hand to draw
    </div>

    <div id="controls">

        <div class="colors">
            <button class="color active" style="background:#00e6a0"
                data-color="#00e6a0"></button>

            <button class="color" style="background:#ffffff"
                data-color="#ffffff"></button>

            <button class="color" style="background:#ff3158"
                data-color="#ff3158"></button>

            <button class="color" style="background:#4287ff"
                data-color="#4287ff"></button>

            <button class="color" style="background:#ffcb45"
                data-color="#ffcb45"></button>

            <button class="color" style="background:#bd70ff"
                data-color="#bd70ff"></button>
        </div>

        <div class="buttons">
            <button id="start" onclick="startCamera()">
                Start Camera
            </button>

            <button id="clear" onclick="clearDrawing()">
                Clear Drawing
            </button>
        </div>

        <input id="brush" type="range"
            min="2" max="25" value="6">

    </div>
</div>

<script>

const video = document.getElementById("video");

const drawCanvas = document.getElementById("drawCanvas");
const cursorCanvas = document.getElementById("cursorCanvas");

const drawCtx = drawCanvas.getContext("2d");
const cursorCtx = cursorCanvas.getContext("2d");

const statusText = document.getElementById("status");

let stream = null;
let hands = null;
let running = false;
let processing = false;

let drawing = false;
let lastPoint = null;
let smoothPoint = null;

let brushColor = "#00e6a0";
let brushSize = 6;

let lastHandSeen = 0;

function resizeCanvas() {
    const width = video.videoWidth;
    const height = video.videoHeight;

    drawCanvas.width = width;
    drawCanvas.height = height;

    cursorCanvas.width = width;
    cursorCanvas.height = height;

    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
}

function clearDrawing() {
    drawCtx.clearRect(
        0, 0, drawCanvas.width, drawCanvas.height
    );
}

document.querySelectorAll(".color").forEach(button => {
    button.addEventListener("click", () => {

        brushColor = button.dataset.color;

        document.querySelectorAll(".color").forEach(b => {
            b.classList.remove("active");
        });

        button.classList.add("active");
    });
});

document.getElementById("brush").addEventListener("input", e => {
    brushSize = Number(e.target.value);
});

async function startCamera() {

    stopCamera();

    statusText.textContent = "Starting camera...";

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30, max: 30 }
            }
        });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        if (!hands) {

            statusText.textContent = "Loading hand tracking...";

            hands = new Hands({
                locateFile: file =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.65,
                minTrackingConfidence: 0.65
            });

            hands.onResults(onResults);
        }

        running = true;

        statusText.textContent = "Show your hand to the camera";

        processFrame();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera error. Allow camera access and reload.";

    }
}

function stopCamera() {

    running = false;
    drawing = false;
    lastPoint = null;
    smoothPoint = null;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    video.srcObject = null;

    cursorCtx.clearRect(
        0, 0, cursorCanvas.width, cursorCanvas.height
    );
}

async function processFrame() {

    if (!running || processing) return;

    processing = true;

    try {
        if (video.readyState >= 2) {
            await hands.send({ image: video });
        }
    } catch (error) {
        console.error(error);
    }

    processing = false;

    if (running) {
        requestAnimationFrame(processFrame);
    }
}

function onResults(results) {

    cursorCtx.clearRect(
        0, 0, cursorCanvas.width, cursorCanvas.height
    );

    if (!results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0) {

        drawing = false;
        lastPoint = null;
        smoothPoint = null;

        statusText.textContent = "Show your hand to the camera";
        return;
    }

    lastHandSeen = performance.now();

    const landmarks = results.multiHandLandmarks[0];

    // Index fingertip = landmark 8
    // Thumb fingertip = landmark 4

    const index = landmarks[8];
    const thumb = landmarks[4];

    const width = drawCanvas.width;
    const height = drawCanvas.height;

    const point = {
        x: index.x * width,
        y: index.y * height
    };

    // Calculate thumb-to-index distance
    const dx = (index.x - thumb.x) * width;
    const dy = (index.y - thumb.y) * height;

    const pinchDistance =
        Math.hypot(dx, dy) / Math.min(width, height);

    // Draw using pinch detection with hysteresis
    if (!drawing && pinchDistance < 0.045) {

        drawing = true;
        lastPoint = null;
        smoothPoint = point;

    } else if (drawing && pinchDistance > 0.065) {

        drawing = false;
        lastPoint = null;
        smoothPoint = null;

    }

    // Smooth hand movement
    if (drawing) {

        if (!smoothPoint) {
            smoothPoint = point;
        } else {

            const smoothing = 0.55;

            smoothPoint.x +=
                (point.x - smoothPoint.x) * smoothing;

            smoothPoint.y +=
                (point.y - smoothPoint.y) * smoothing;
        }

        if (lastPoint) {

            drawCtx.beginPath();

            drawCtx.moveTo(lastPoint.x, lastPoint.y);

            drawCtx.lineTo(
                smoothPoint.x,
                smoothPoint.y
            );

            drawCtx.strokeStyle = brushColor;
            drawCtx.lineWidth = brushSize;

            drawCtx.lineCap = "round";
            drawCtx.lineJoin = "round";

            drawCtx.shadowColor = brushColor;
            drawCtx.shadowBlur = 5;

            drawCtx.stroke();

            drawCtx.shadowBlur = 0;
        }

        lastPoint = {
            x: smoothPoint.x,
            y: smoothPoint.y
        };

        statusText.textContent = "● DRAWING";

    } else {

        statusText.textContent = "READY · Touch fingers to draw";

    }

    // Draw cursor around index fingertip
    cursorCtx.beginPath();

    cursorCtx.arc(
        point.x,
        point.y,
        drawing ? 12 : 8,
        0,
        Math.PI * 2
    );

    cursorCtx.strokeStyle = drawing ? brushColor : "#ffffff";
    cursorCtx.lineWidth = 3;
    cursorCtx.stroke();

    cursorCtx.fillStyle = drawing ? brushColor : "#ffffff";

    cursorCtx.beginPath();

    cursorCtx.arc(
        point.x,
        point.y,
        3,
        0,
        Math.PI * 2
    );

    cursorCtx.fill();
}

</script>

</body>
</html>
