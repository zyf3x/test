<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Battery Drainer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#9dff6b;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{opacity:.5;mix-blend-mode:screen;pointer-events:none}
  .hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;gap:14px;flex-wrap:wrap;
    align-items:baseline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:linear-gradient(#000d,#0000);pointer-events:none;z-index:5}
  .k{opacity:.45}
  .v{color:#e8ffe0;font-weight:700}
  .bomb{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:10px;
    letter-spacing:.3em;text-transform:uppercase;opacity:.3;z-index:5;pointer-events:none;
    text-align:center;width:90%}
  #tap{position:fixed;inset:0;display:grid;place-items:center;z-index:10;cursor:pointer;
    background:#000c;transition:opacity .5s}
  #tap div{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:#fff;
    border:1px solid #9dff6b55;padding:16px 26px;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}
  #stop{position:fixed;right:14px;bottom:14px;z-index:20;background:#111;color:#9dff6b;
    border:1px solid #9dff6b44;padding:8px 14px;font:inherit;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;cursor:pointer}
  #stop:hover{background:#1a1a1a}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div class="hud">
  <span><span class="k">battery</span> <span class="v" id="lvl">--%</span></span>
  <span><span class="k">drain</span> <span class="v" id="rate">--</span></span>
  <span><span class="k">left</span> <span class="v" id="left">--</span></span>
  <span><span class="k">threads</span> <span class="v" id="thr">0</span></span>
  <span><span class="k">ops/s</span> <span class="v" id="ops">0</span></span>
  <span><span class="k">elapsed</span> <span class="v" id="el">0s</span></span>
</div>

<div class="bomb">device will get hot &middot; fan will spin &middot; battery will drop</div>
<button id="stop">stop</button>
<div id="tap"><div>tap to arm audio</div></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var running = true;
  var workers = [], timers = [], wakeLock = null, actx = null;
  var opsMain = 0, opsWorkers = 0, lastOps = 0, lastOpsT = performance.now();
  var startT = performance.now();

  /* ---------------- GPU furnace (full-screen fractal, 512 iterations/pixel) ---------------- */
  var glc = $("gl");
  var gl = glc.getContext("webgl", {
    antialias: false, alpha: false, depth: false, stencil: false,
    powerPreference: "high-performance", desynchronized: true, preserveDrawingBuffer: false
  });

  var uni = { res: null, t: null }, rafId = 0, vbo = null, prog = null;

  var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var FS = [
    "precision highp float;",
    "uniform vec2 res;uniform float t;",
    "void main(){",
    "  vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;",
    "  vec2 c=uv*1.7-vec2(0.95,0.28);",
    "  vec2 z=vec2(0.0);",
    "  float it=0.0;",
    "  for(int i=0;i<512;i++){",
    "    z=vec2(z.x*z.x-z.y*z.y,2.0*z.x*z.y)+c+0.012*vec2(sin(t*0.9),cos(t*1.3));",
    "    if(dot(z,z)>64.0) break;",
    "    it+=1.0;",
    "  }",
    "  float m=it/512.0;",
    "  vec3 col=vec3(m*0.9,m*m*1.15,sqrt(m)*0.85);",
    "  for(int k=0;k<12;k++){ col+=0.018*sin(vec3(t*0.6+float(k)*1.7+uv.xyx*22.0)); }",
    "  col+=0.06*vec3(uv.x+0.5,uv.y+0.5,0.6);",
    "  gl_FragColor=vec4(col,1.0);",
    "}"
  ].join("\n");

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
    return s;
  }

  function initGL() {
    if (!gl) return;
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    uni.res = gl.getUniformLocation(prog, "res");
    uni.t = gl.getUniformLocation(prog, "t");
    resizeGL();
  }

  function resizeGL() {
    if (!gl) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var s = 1.4; // supersample: more pixels = more work
    var w = Math.min(Math.floor(innerWidth * dpr * s), 4096);
    var h = Math.min(Math.floor(innerHeight * dpr * s), 4096);
    glc.width = w; glc.height = h;
    gl.viewport(0, 0, w, h);
    if (uni.res) gl.uniform2f(uni.res, w, h);
  }

  function glFrame(t) {
    if (!running || !gl) return;
    gl.uniform1f(uni.t, t * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    rafId = requestAnimationFrame(glFrame);
  }

  /* ---------------- 2D overdraw layer ---------------- */
  var fxc = $("fx"), ctx = fxc.getContext("2d");
  function resizeFX() {
    fxc.width = innerWidth; fxc.height = innerHeight;
    ctx.lineWidth = 1;
  }

  function fxFrame() {
    if (!running) return;
    ctx.clearRect(0, 0, fxc.width, fxc.height);
    var w = fxc.width, h = fxc.height;
    for (var i = 0; i < 900; i++) {
      var x = Math.random() * w, y = Math.random() * h;
      ctx.strokeStyle = "hsl(" + ((i * 7 + performance.now() * 0.05) % 360) + ",100%,60%)";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + (Math.random() - 0.5) * 180, y + (Math.random() - 0.5) * 180);
      ctx.stroke();
    }
    requestAnimationFrame(fxFrame);
  }

  /* ---------------- main-thread math burner ---------------- */
  function burnMain() {
    if (!running) return;
    var x = 1.0001, y = 0.5;
    for (var i = 0; i < 150000; i++) {
      x = Math.sin(x * 1.0000001) + Math.sqrt(Math.abs(y)) * 0.0001;
      y = Math.cos(y) * 1.0000001 + Math.abs(x) * 0.0001;
    }
    opsMain += 150000;
    setTimeout(burnMain, 0);
  }

  /* ---------------- worker swarm: saturate every core ---------------- */
  var workerSrc = [
    "var ops=0,buf=new Float64Array(4096),N=400000;",
    "function spin(){",
    "  var x=1.0001,y=0.3;",
    "  for(var i=0;i<N;i++){",
    "    x=x*1.0000001+Math.sin(x)*0.001;",
    "    y=Math.sqrt(Math.abs(y))+Math.cos(x)*0.001;",
    "    buf[i&4095]=x+y;",
    "  }",
    "  ops+=N;",
    "  buf=new Float64Array(4096);",
    "  setTimeout(spin,0);",
    "}",
    "spin();",
    "setInterval(function(){postMessage(ops);},500);"
  ].join("\n");

  function spawnWorkers() {
    var n = Math.max(2, Math.min(navigator.hardwareConcurrency || 2, 16));
    var blob = new Blob([workerSrc], { type: "text/javascript" });
    var url = URL.createObjectURL(blob);
    for (var i = 0; i < n; i++) {
      try {
        var w = new Worker(url);
        w.onmessage = function (e) { opsWorkers += e.data; };
        workers.push(w);
      } catch (err) { /* workers blocked, main thread still burns */ }
    }
    $("thr").textContent = workers.length;
  }

  /* ---------------- audio drone (keeps the audio chip awake) ---------------- */
  function armAudio() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    actx.resume();

    var master = actx.createGain();
    master.gain.value = 0.05;
    master.connect(actx.destination);

    [41, 55, 82, 110, 164].forEach(function (f, i) {
      var o = actx.createOscillator();
      o.type = i % 2 ? "sawtooth" : "square";
      o.frequency.value = f;
      var g = actx.createGain();
      g.gain.value = 0.25 / (i + 1);
      o.connect(g); g.connect(master);
      o.start();
    });

    // white noise loop
    var len = actx.sampleRate * 2;
    var nb = actx.createBuffer(1, len, actx.sampleRate);
    var d = nb.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var ns = actx.createBufferSource();
    ns.buffer = nb; ns.loop = true;
    var ng = actx.createGain(); ng.gain.value = 0.35;
    ns.connect(ng); ng.connect(master);
    ns.start();
  }

  /* ---------------- screen wake lock + vibration ---------------- */
  function lockScreen() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { if (running) lockScreen(); });
    }).catch(function () {});
  }

  function buzz() {

    navigator.vibrate([250, 120,
