<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Battery Killer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;color:#9dff6b;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl,#fx,#bright{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{opacity:.75;mix-blend-mode:screen;pointer-events:none}
  #bright{opacity:.35;mix-blend-mode:screen;pointer-events:none}
  #vid{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
  .hud{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;gap:12px;
    flex-wrap:wrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:linear-gradient(#000e,#0000);pointer-events:none;z-index:5}
  .k{opacity:.4}.v{color:#e8ffe0;font-weight:700}
  #stat{position:fixed;left:12px;bottom:12px;font-size:10px;letter-spacing:.1em;
    line-height:1.85;text-transform:uppercase;z-index:5;pointer-events:none;opacity:.8}
  #stat b{color:#e8ffe0;font-weight:700}#stat .off{color:#ff5d5d}
  #stop{position:fixed;right:12px;bottom:12px;z-index:20;background:#111;color:#9dff6b;
    border:1px solid #9dff6b44;padding:8px 14px;font:inherit;font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
  #arm{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
    background:#000a;transition:opacity .4s}
  #arm div{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#fff;
    border:1px solid #9dff6b66;padding:14px 24px;animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="bright"></canvas>
<video id="vid" muted playsinline></video>

<div class="hud">
  <span><span class="k">bat</span> <span class="v" id="lvl">--%</span></span>
  <span><span class="k">drain</span> <span class="v" id="rate">--</span></span>
  <span><span class="k">left</span> <span class="v" id="left">--</span></span>
  <span><span class="k">ops/s</span> <span class="v" id="ops">0</span></span>
  <span><span class="k">fps</span> <span class="v" id="fps">0</span></span>
  <span><span class="k">load</span> <span class="v" id="load">3x</span></span>
  <span><span class="k">t</span> <span class="v" id="el">0s</span></span>
</div>

<div id="stat"></div>
<button id="stop">stop</button>
<div id="arm"><div>tap once &mdash; arms audio + vibration</div></div>

<script>
(function () {
"use strict";

var S = { gpu:0, cpu:0, workers:0, audio:0, dsp:0, vib:0, gps:0, wake:0, bat:0, vid:0 };
var running = true, actx = null, wakeLock = null, vidStream = null;
var workers = [], timers = [], rafIds = [], geoId = null;
var opsMain = 0, opsWk = 0, opsSeen = 0, opsT = performance.now();
var frames = 0, t0 = performance.now(), startT = performance.now();
var passes = 3, scale = 1.5;

function $(id) { return document.getElementById(id); }
function safe(fn) { try { return fn() !== false; } catch (e) { return false; } }

function paintStat() {
  var r = [["GPU", S.gpu], ["CPU", S.cpu], ["THREADS", S.workers], ["AUDIO", S.audio],
           ["DSP", S.dsp], ["VIBRATE", S.vib], ["GPS", S.gps], ["SCREEN", S.wake],
           ["VIDEO", S.vid], ["BATTERY API", S.bat]];
  var h = "";
  for (var i = 0; i < r.length; i++) {
    var on = r[i][1];
    h += '<span class="' + (on ? "" : "off") + '">' + r[i][0] + " <b>" +
         (on === true || on === 1 ? "OK" : (on === 0 ? "OFF" : on)) + "</b></span><br>";
  }
  $("stat").innerHTML = h;
}

/* ================= GPU: raymarcher, 3 passes ================= */
var glc = $("gl"), gl = null, prog = null, uni = {};

var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS = [
"precision highp float;uniform vec2 res;uniform float t;",
"float map(vec3 p){",
" float d=length(p)-1.0;",
" d=min(d,length(p-vec3(sin(t)*1.4,cos(t*1.1),0.0))-0.55);",
" d+=0.16*sin(p.x*6.0+t)*sin(p.y*6.0-t)*sin(p.z*6.0);",
" return d;}",
"void main(){",
" vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;",
" vec3 ro=vec3(0.,0.,-3.2),rd=normalize(vec3(uv,1.25));",
" float d=0.0,g=0.0;",
" for(int i=0;i<96;i++){",
"  vec3 p=ro+rd*d;float h=map(p);",
"  g+=0.022/(0.06+h*h*40.0);",
"  d+=max(h*0.65,0.012);",
"  if(d>9.5)break;",
" }",
" vec3 col=vec3(g*0.55,g*0.95,g*1.5);",
" for(int k=0;k<10;k++){col+=0.016*sin(vec3(t*0.7+float(k)*2.1+uv.xyx*26.0));}",
" col=pow(col,vec3(0.85));",
" gl_FragColor=vec4(col,1.0);}"
].join("\n");

function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }

function initGL() {
  gl = glc.getContext("webgl", { antialias:false, alpha:false, depth:false, stencil:false,
    powerPreference:"high-performance", desynchronized:true });
  if (!gl) return false;
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  var b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  var l = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
  uni.res = gl.getUniformLocation(prog, "res");
  uni.t = gl.getUniformLocation(prog, "t");
  resizeGL();
  return true;
}

function resizeGL() {
  if (!gl) return;
  var d = Math.min(window.devicePixelRatio || 1, 3) * scale;
  var w = Math.min(Math.floor(innerWidth * d), 4096);
  var h = Math.min(Math.floor(innerHeight * d), 4096);
  glc.width = w; glc.height = h;
  gl.viewport(0, 0, w, h);
  if (uni.res) gl.uniform2f(uni.res, w, h);
}

function gpuLoop(t) {
  if (!running || !gl) return;
  for (var p = 0; p < passes; p++) {
    gl.uniform1f(uni.t, t * 0.0012 + p * 0.31);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  frames++;
  rafIds.push(requestAnimationFrame(gpuLoop));
}

/* ================= overlay: bright blobs (backlight) ================= */
var fxc = $("fx"), ctx = fxc.getContext("2d");
function fxLoop() {
  if (!running) return;
  if (fxc.width !== innerWidth) fxc.width = innerWidth;
  if (fxc.height !== innerHeight) fxc.height = innerHeight;
  ctx.clearRect(0, 0, fxc.width, fxc.height);
  for (var i = 0; i < 700; i++) {
    var x = Math.random() * fxc.width, y = Math.random() * fxc.height;
    ctx.strokeStyle = "hsl(" + ((i * 11 + performance.now() * 0.08) % 360) + ",100%,62%)";
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - .5) * 240, y + (Math.random() - .5) * 240);
    ctx.stroke();
  }
  rafIds.push(requestAnimationFrame(fxLoop));
}

function brightLoop() {
  if (!running) return;
  if (bc.width !== innerWidth) bc.width = innerWidth;
  if (bc.height !== innerHeight) bc.height = innerHeight;

  bctx.globalCompositeOperation = "lighter";

    var cy = bc.height * (0.5 + 0.42 * Math.cos(tt * 1.3 + i * 2.3));
